<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-red-600 mb-4">⚠️ Confirmar Eliminación</h1>
        <p class="text-gray-700 mb-2">¿Deseas desactivar este producto?</p>
        <p class="text-xl font-semibold text-gray-800 mb-6">"{{ producto.nombre }}"</p>
        
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'lista_productos' %}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">Cancelar</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-semibold">Desactivar</button>
        </form>
    </div>
</body>
</html>
