<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md text-center">
    <div class="text-red-500 text-5xl mb-3">⚠️</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">¿Eliminar Cliente?</h2>
    <p class="text-gray-600 text-sm mb-6">
      Estás a punto de eliminar a <strong>{{ cliente.nombre }}</strong> (NIT: {{ cliente.nit }}). Esta acción no se puede deshacer.
    </p>

    <form method="POST" class="flex justify-center space-x-4">
      {% csrf_token %}
      <a href="{% url 'lista_clientes' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Cancelar</a>
      <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-bold">Sí, Eliminar</button>
    </form>
  </div>

</body>
</html>
