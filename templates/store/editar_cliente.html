<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg">
    <h2 class="text-xl font-bold text-gray-800 mb-4">✏️ Editar Cliente</h2>

    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-gray-700">NIT *</label>
        <input type="text" name="nit" required value="{{ cliente.nit }}" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700">Nombre / Razón Social *</label>
        <input type="text" name="nombre" required value="{{ cliente.nombre }}" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700">Teléfono</label>
        <input type="text" name="telefono" value="{{ cliente.telefono|default:'' }}" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700">Correo Electrónico</label>
        <input type="email" name="email" value="{{ cliente.email|default:'' }}" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700">Dirección</label>
        <textarea name="direccion" rows="2" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">{{ cliente.direccion|default:'' }}</textarea>
      </div>

      <div class="flex justify-end space-x-3 pt-3">
        <a href="{% url 'lista_clientes' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Cancelar</a>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold">Actualizar</button>
      </div>
    </form>
  </div>

</body>
</html>
